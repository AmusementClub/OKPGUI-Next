name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to create or use for the draft release
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }} asset
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            slug: windows-x64
            mediainfo_target: x86_64-pc-windows-msvc
            build_args: --no-bundle
            asset_path: src-tauri/target/release/okpgui-next.exe
          - name: macOS arm64
            os: macos-latest
            slug: macos-arm64
            mediainfo_target: aarch64-apple-darwin
            build_args: --bundles dmg
            asset_path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            slug: linux-x64
            mediainfo_target: x86_64-unknown-linux-gnu
            build_args: --bundles appimage
            asset_path: src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: BYOK release gates (offline packaging + honesty)
        run: node scripts/verify-byok-release-gates.mjs

      - name: MediaInfo sidecar inventory gate
        run: node scripts/verify-mediainfo-package.mjs --manifest-only

      - name: Stage MediaInfo sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage-mediainfo.ps1 -Target '${{ matrix.platform.mediainfo_target }}'
          node scripts/verify-mediainfo-package.mjs --target '${{ matrix.platform.mediainfo_target }}'

      - name: Stage MediaInfo sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/stage-mediainfo.sh
          ./scripts/stage-mediainfo.sh '${{ matrix.platform.mediainfo_target }}'
          node scripts/verify-mediainfo-package.mjs --target '${{ matrix.platform.mediainfo_target }}'

      - name: Cargo fmt gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo clippy gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Offline provider/security contract gate
        run: |
          node scripts/verify-provider-contract.mjs
          cargo test --manifest-path src-tauri/Cargo.toml provider_contract -- --nocapture

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Playwright browser/UI integration (mocked Tauri IPC; not desktop E2E)
        run: |
          # Installs pinned Chromium; mocked Tauri IPC only (not desktop E2E).
          pnpm run test:ui-integration

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native application output
        run: pnpm tauri build ${{ matrix.platform.build_args }}

      - name: Force Windows single-EXE embedded MediaInfo smoke path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staged = 'src-tauri/binaries/mediainfo-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path -LiteralPath $staged -PathType Leaf)) {
            throw "Embedded MediaInfo source was not staged before compilation: $staged"
          }
          Remove-Item -LiteralPath $staged -Force
          Write-Host 'Removed the build-time sidecar so host smoke must release MediaInfo from okpgui-next.exe.'

      # --- Package smoke: Windows EXE / Linux AppImage ---
      # Exit status + ephemeral smoke report validation (ok + production marker).
      - name: Package smoke (Windows/Linux)
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          OKPGUI_DESKTOP_SMOKE_REQUIRE_SIDECAR: 1
          OKPGUI_SMOKE_PACKAGED_ONLY: 1
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="src-tauri/target/release/okpgui-next.exe"
            if [[ ! -f "$BINARY" ]]; then
              echo "::error title=Package smoke::Built Windows EXE not found at $BINARY"
              exit 1
            fi
            export OKPGUI_PACKAGE_SMOKE_BIN="$BINARY"
            echo "OKPGUI_PACKAGE_SMOKE_BIN=$OKPGUI_PACKAGE_SMOKE_BIN"
          else
            shopt -s nullglob
            appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
            if [[ ${#appimages[@]} -ne 1 ]]; then
              echo "::error title=Package smoke::Expected exactly one AppImage, found ${#appimages[@]}"
              exit 1
            fi
            BINARY="${appimages[0]}"
            chmod +x "$BINARY"
            export OKPGUI_APPIMAGE="$BINARY"
            export OKPGUI_PACKAGE_SMOKE_BIN="$BINARY"
            echo "OKPGUI_APPIMAGE=$OKPGUI_APPIMAGE"
          fi
          node scripts/run-package-smoke.mjs
          echo "::notice title=Package smoke::Windows EXE / Linux AppImage smoke passed (exit status + report)."


      # --- Package smoke: macOS packaged .app from DMG ---
      - name: Package smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error title=Package smoke::Expected exactly one DMG, found ${#dmgs[@]}"
            exit 1
          fi
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/okpgui-dmg.XXXXXX")"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
          apps=("$mount_dir"/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "::error title=Package smoke::Expected exactly one .app in DMG, found ${#apps[@]}"
            exit 1
          fi
          app="${apps[0]}"
          export OKPGUI_MACOS_APP="$app"
          export OKPGUI_SMOKE_PACKAGED_ONLY=1
          export OKPGUI_DESKTOP_SMOKE_REQUIRE_SIDECAR=1
          echo "OKPGUI_MACOS_APP=$OKPGUI_MACOS_APP"
          echo "OKPGUI_SMOKE_PACKAGED_ONLY=$OKPGUI_SMOKE_PACKAGED_ONLY"
          node scripts/run-package-smoke.mjs
          echo "::notice title=Package smoke::macOS packaged .app smoke passed (exit status + report)."


      - name: Upload native application output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.slug }}-release-asset
          if-no-files-found: error
          compression-level: 0
          path: ${{ matrix.platform.asset_path }}

  release:
    name: Create draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v6
        with:
          pattern: '*-release-asset'
          merge-multiple: true
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || github.event.inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
