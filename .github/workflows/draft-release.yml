name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to create or use for the draft release
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }} asset
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            slug: windows-x64
            mediainfo_target: x86_64-pc-windows-msvc
            bundle_target: nsis
            asset_path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS arm64
            os: macos-latest
            slug: macos-arm64
            mediainfo_target: aarch64-apple-darwin
            bundle_target: dmg
            asset_path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            slug: linux-x64
            mediainfo_target: x86_64-unknown-linux-gnu
            bundle_target: appimage
            asset_path: src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository hygiene gate
        run: node scripts/verify-repository-hygiene.mjs

      - name: BYOK release gates (offline packaging + honesty)
        run: node scripts/verify-byok-release-gates.mjs

      - name: MediaInfo sidecar inventory gate
        run: node scripts/verify-mediainfo-package.mjs --manifest-only

      - name: Stage MediaInfo sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage-mediainfo.ps1 -Target '${{ matrix.platform.mediainfo_target }}'
          node scripts/verify-mediainfo-package.mjs --target '${{ matrix.platform.mediainfo_target }}'

      - name: Stage MediaInfo sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/stage-mediainfo.sh
          ./scripts/stage-mediainfo.sh '${{ matrix.platform.mediainfo_target }}'
          node scripts/verify-mediainfo-package.mjs --target '${{ matrix.platform.mediainfo_target }}'

      - name: Cargo fmt gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo clippy gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Offline provider/security contract gate
        run: |
          node scripts/verify-provider-contract.mjs
          cargo test --manifest-path src-tauri/Cargo.toml provider_contract -- --nocapture

      - name: Offline UI integration inventory gate
        run: node scripts/verify-ui-integration-inventory.mjs

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Playwright browser/UI integration (mocked Tauri IPC; not desktop E2E)
        run: |
          # Installs pinned Chromium; mocked Tauri IPC only (not desktop E2E).
          pnpm run test:ui-integration

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native application package
        run: pnpm tauri build --bundles ${{ matrix.platform.bundle_target }}

      # --- Evidence class: host-binary-smoke (Windows/Linux) ---
      # DESKTOP_E2E_ALLOW_BLOCKED is not used when binary exists (REQUIRE_PASS instead).
      # desktop-webdriver side-evidence may be blocked (WDIO specs still stubs).
      - name: Desktop production critical flows (Windows/Linux)
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        env:
          DESKTOP_E2E_TARGET: ${{ matrix.platform.mediainfo_target }}
        run: |
          set -euo pipefail
          mkdir -p tests/desktop-e2e/out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="src-tauri/target/release/okpgui-next.exe"
          else
            BINARY="src-tauri/target/release/okpgui-next"
          fi
          if [[ ! -f "$BINARY" ]]; then
            echo "::error title=Desktop production smoke::Built binary not found at $BINARY"
            exit 1
          fi
          export DESKTOP_E2E_BINARY="$BINARY"
          export DESKTOP_E2E_REQUIRE_PASS=1
          node scripts/run-desktop-e2e.mjs
          shopt -s nullglob
          evidence_files=(tests/desktop-e2e/out/evidence-*.json)
          primary=()
          for f in "${evidence_files[@]}"; do
            case "$(basename "$f")" in
              evidence-webdriver-blocked-*) ;;
              *) primary+=("$f") ;;
            esac
          done
          if [[ ${#primary[@]} -eq 0 ]]; then
            echo "::error title=Desktop production smoke::Required host-binary-smoke evidence JSON missing"
            exit 1
          fi
          for f in "${primary[@]}"; do
            node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(e.result!=="pass"||e.harnessType!=="host-binary-smoke"||e.productionBinaryMarker!==true||e.productionIpcMarker===true){console.error(process.argv[1],e);process.exit(1);}' "$f"
          done
          echo "::notice title=Host binary smoke::pass with productionBinaryMarker=true (not WebDriver)."

      # --- Evidence class: macos-packaged-smoke ---
      # Mount the final DMG and execute its packaged .app.
      - name: macOS packaged production smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          DESKTOP_E2E_TARGET: ${{ matrix.platform.mediainfo_target }}
        run: |
          set -euo pipefail
          mkdir -p tests/desktop-e2e/out
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error title=macOS packaged smoke::Expected exactly one DMG, found ${#dmgs[@]}"
            exit 1
          fi
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/okpgui-dmg.XXXXXX")"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
          apps=("$mount_dir"/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "::error title=macOS packaged smoke::Expected exactly one .app in DMG, found ${#apps[@]}"
            exit 1
          fi
          app="${apps[0]}"
          base="$(basename "$app" .app)"
          for candidate in "$app/Contents/MacOS/okpgui-next" "$app/Contents/MacOS/$base"; do
            if [[ -f "$candidate" ]]; then
              export DESKTOP_E2E_BINARY="$candidate"
              break
            fi
          done
          if [[ -z "${DESKTOP_E2E_BINARY:-}" ]]; then
            echo "::error title=macOS packaged smoke::Packaged .app executable not found in DMG"
            exit 1
          fi
          export DESKTOP_E2E_PACKAGE="${dmgs[0]}"
          export MACOS_PACKAGED_APP="$app"
          export DESKTOP_E2E_REQUIRE_PASS=1
          node scripts/run-macos-packaged-smoke.mjs
          shopt -s nullglob
          evidence_files=(tests/desktop-e2e/out/evidence-*.json)
          primary=()
          for f in "${evidence_files[@]}"; do
            case "$(basename "$f")" in
              evidence-webdriver-blocked-*) ;;
              *) primary+=("$f") ;;
            esac
          done
          if [[ ${#primary[@]} -eq 0 ]]; then
            echo "::error title=macOS packaged smoke::Required evidence JSON missing"
            exit 1
          fi
          for f in "${primary[@]}"; do
            node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(e.result!=="pass"||e.harnessType!=="macos-packaged-smoke"||e.productionBinaryMarker!==true||e.productionIpcMarker===true){console.error(process.argv[1],e);process.exit(1);}' "$f"
          done
          echo "::notice title=macOS packaged smoke::pass with productionBinaryMarker=true, productionIpcMarker=false."

      - name: Upload desktop / packaged evidence JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-evidence-${{ matrix.platform.slug }}
          if-no-files-found: warn
          path: |
            tests/desktop-e2e/out/evidence-*.json

      - name: Upload native release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.slug }}-release-asset
          if-no-files-found: error
          compression-level: 0
          path: ${{ matrix.platform.asset_path }}

  release:
    name: Create draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v6
        with:
          pattern: '*-release-asset'
          merge-multiple: true
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || github.event.inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
