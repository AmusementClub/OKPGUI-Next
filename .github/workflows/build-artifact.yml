name: Build Artifact

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }} Artifact
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            artifact_name: okpgui-next-windows-artifact
            mediainfo_target: x86_64-pc-windows-msvc
          - name: macOS x64
            os: macos-13
            artifact_name: okpgui-next-macos-x64-artifact
            mediainfo_target: x86_64-apple-darwin
          - name: macOS arm64
            os: macos-latest
            artifact_name: okpgui-next-macos-arm64-artifact
            mediainfo_target: aarch64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            artifact_name: okpgui-next-linux-artifact
            mediainfo_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: BYOK release gates (offline packaging + honesty)
        run: node scripts/verify-byok-release-gates.mjs

      - name: MediaInfo sidecar inventory gate
        run: node scripts/verify-mediainfo-package.mjs --manifest-only

      - name: Stage MediaInfo sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage-mediainfo.ps1 -Target '${{ matrix.platform.mediainfo_target }}'
          node scripts/verify-mediainfo-package.mjs --target '${{ matrix.platform.mediainfo_target }}'

      - name: Stage MediaInfo sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/stage-mediainfo.sh
          ./scripts/stage-mediainfo.sh '${{ matrix.platform.mediainfo_target }}'
          node scripts/verify-mediainfo-package.mjs --target '${{ matrix.platform.mediainfo_target }}'

      - name: Cargo fmt gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo clippy gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Offline provider/security contract gate
        run: |
          node scripts/verify-provider-contract.mjs
          # Behavioral offline contract (localhost mock only; no live/paid providers).
          cargo test --manifest-path src-tauri/Cargo.toml provider_contract -- --nocapture

      - name: Offline UI integration inventory gate
        run: node scripts/verify-ui-integration-inventory.mjs

      - name: Run frontend tests
        run: pnpm test

      - name: Run frontend build
        run: pnpm build

      - name: Playwright browser/UI integration (mocked Tauri IPC; not desktop E2E)
        run: |
          # Uses scripts/run-playwright-ui-integration.mjs so frozen-lockfile installs
          # still run browser/UI integration without a committed Playwright lock entry.
          # This is not desktop E2E / WebDriver / packaged-app automation.
          pnpm run test:ui-integration

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: pnpm tauri build

      # --- Evidence class: host-binary-smoke (Windows/Linux only) ---
      # Production Rust in built binary. productionBinaryMarker=true; productionIpcMarker must stay false.
      # desktop-webdriver is recorded as blocked side-evidence until executable WDIO specs land.
      # When the release binary exists, REQUIRE_PASS=1 — blocked is not accepted as green for host smoke.
      - name: Desktop production critical flows (Windows/Linux)
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        env:
          DESKTOP_E2E_TARGET: ${{ matrix.platform.mediainfo_target }}
        run: |
          set -euo pipefail
          mkdir -p tests/desktop-e2e/out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="src-tauri/target/release/okpgui-next.exe"
          else
            BINARY="src-tauri/target/release/okpgui-next"
          fi
          if [[ -f "$BINARY" ]]; then
            export DESKTOP_E2E_BINARY="$BINARY"
            export DESKTOP_E2E_REQUIRE_PASS=1
            echo "DESKTOP_E2E_BINARY=$DESKTOP_E2E_BINARY (require pass)"
          else
            export DESKTOP_E2E_ALLOW_BLOCKED=1
            echo "::error title=Desktop production smoke::Built binary not found at $BINARY after tauri build"
            node scripts/run-desktop-e2e.mjs || true
            exit 1
          fi
          node scripts/run-desktop-e2e.mjs
          shopt -s nullglob
          # Primary pass evidence is host-binary-smoke (ignore webdriver-blocked side files).
          evidence_files=(tests/desktop-e2e/out/evidence-*.json)
          primary=()
          for f in "${evidence_files[@]}"; do
            case "$(basename "$f")" in
              evidence-webdriver-blocked-*) ;;
              *) primary+=("$f") ;;
            esac
          done
          if [[ ${#primary[@]} -eq 0 ]]; then
            echo "::error title=Desktop production smoke::Required host-binary-smoke evidence JSON missing"
            exit 1
          fi
          for f in "${primary[@]}"; do
            echo "Evidence: $f"
            node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(e.result!=="pass"||e.harnessType!=="host-binary-smoke"||e.productionBinaryMarker!==true||e.productionIpcMarker===true){console.error("Evidence not a host-binary-smoke pass:",process.argv[1],e);process.exit(1);}' "$f"
          done
          echo "::notice title=Host binary smoke::pass with productionBinaryMarker=true (not WebDriver, productionIpcMarker=false)."

      # --- Evidence class: macos-packaged-smoke (macOS only) ---
      # Prefer packaged .app over raw release binary. Not full UI WebDriver.
      - name: macOS packaged production smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          DESKTOP_E2E_TARGET: ${{ matrix.platform.mediainfo_target }}
        run: |
          set -euo pipefail
          mkdir -p tests/desktop-e2e/out
          # Prefer .app bundle first (packaged evidence), then raw release binary.
          unset DESKTOP_E2E_BINARY || true
          shopt -s nullglob
          for app in src-tauri/target/release/bundle/macos/*.app; do
            base="$(basename "$app" .app)"
            for cand in "$app/Contents/MacOS/okpgui-next" "$app/Contents/MacOS/$base"; do
              if [[ -f "$cand" ]]; then
                export DESKTOP_E2E_BINARY="$cand"
                export DESKTOP_E2E_PACKAGE="$app"
                break 2
              fi
            done
          done
          if [[ -z "${DESKTOP_E2E_BINARY:-}" ]]; then
            BINARY="src-tauri/target/release/okpgui-next"
            if [[ -f "$BINARY" ]]; then
              export DESKTOP_E2E_BINARY="$BINARY"
            fi
          fi
          if [[ -z "${DESKTOP_E2E_BINARY:-}" ]]; then
            echo "::error title=macOS packaged smoke::Built binary not found after tauri build"
            export DESKTOP_E2E_ALLOW_BLOCKED=1
            node scripts/run-macos-packaged-smoke.mjs || true
            exit 1
          fi
          export DESKTOP_E2E_REQUIRE_PASS=1
          echo "DESKTOP_E2E_BINARY=$DESKTOP_E2E_BINARY (require pass)"
          node scripts/run-macos-packaged-smoke.mjs
          shopt -s nullglob
          evidence_files=(tests/desktop-e2e/out/evidence-*.json)
          primary=()
          for f in "${evidence_files[@]}"; do
            case "$(basename "$f")" in
              evidence-webdriver-blocked-*) ;;
              *) primary+=("$f") ;;
            esac
          done
          if [[ ${#primary[@]} -eq 0 ]]; then
            echo "::error title=macOS packaged smoke::Required evidence JSON missing"
            exit 1
          fi
          for f in "${primary[@]}"; do
            node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(e.result!=="pass"||e.harnessType!=="macos-packaged-smoke"||e.productionBinaryMarker!==true||e.productionIpcMarker===true){console.error("Evidence not a macos-packaged-smoke pass:",process.argv[1],e);process.exit(1);}' "$f"
          done
          echo "::notice title=macOS packaged smoke::pass with productionBinaryMarker=true, productionIpcMarker=false."

      - name: Upload desktop / packaged evidence JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-evidence-${{ matrix.platform.artifact_name }}
          if-no-files-found: warn
          path: |
            tests/desktop-e2e/out/evidence-*.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/okpgui-next*
            src-tauri/binaries/mediainfo-${{ matrix.platform.mediainfo_target }}
            src-tauri/binaries/mediainfo-${{ matrix.platform.mediainfo_target }}.exe
            src-tauri/resources/mediainfo/THIRD_PARTY_NOTICES.html
